name: Selenium Magento Tests

on:
  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Selenium repository
        uses: actions/checkout@v5

      - name: Checkout Magento environment
        uses: actions/checkout@v5
        with:
          repository: lruizajax/magento-testing-playground
          ref: master
          path: magento-environment
          token: ${{ secrets.MAGENTO_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Install Allure
        run: |
          ALLURE_VERSION=2.44.1
          wget https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -zxvf allure-${ALLURE_VERSION}.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH

      - name: Verify Allure version
        run: allure --version

      - name: Start Magento environment
        run: docker compose -f magento-environment/docker-compose.student.yml up -d

      - name: Wait for Magento
        run: |
          for attempt in {1..60}; do
            status_code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081 || true)"
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              echo "Magento responded with HTTP $status_code"
              exit 0
            fi
            echo "Waiting for Magento at http://localhost:8081 (attempt $attempt/60)"
            sleep 5
          done
          echo "Magento did not respond within the configured timeout"
          docker compose -f magento-environment/docker-compose.student.yml ps
          docker compose -f magento-environment/docker-compose.student.yml logs --no-color
          exit 1

      - name: Run TestNG suite
        env:
          CI: true
        run: mvn clean test -Dsurefire.suiteXmlFiles=testng.xml

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d target/allure-results ] && [ "$(find target/allure-results -type f | wc -l)" -gt 0 ]; then
            allure generate target/allure-results --clean -o target/allure-report
          else
            echo "No Allure results found; skipping report generation"
          fi

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: warn

      - name: Docker diagnostics on failure
        if: failure()
        run: |
          docker compose -f magento-environment/docker-compose.student.yml ps
          docker compose -f magento-environment/docker-compose.student.yml logs --no-color

      - name: Stop Magento environment
        if: always()
        run: docker compose -f magento-environment/docker-compose.student.yml down -v
